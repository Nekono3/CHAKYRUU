services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chakyruu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chakyruu}
      POSTGRES_DB: ${POSTGRES_DB:-chakyruu}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chakyruu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://chakyruu:chakyruu@postgres:5432/chakyruu?schema=public}
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_string}
      PORT: ${PORT:-4000}
      NODE_ENV: production
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy --schema=server/prisma/schema.prisma && node server/dist/index.js"

volumes:
  pgdata:
